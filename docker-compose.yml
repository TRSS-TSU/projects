services:
  tracker-php:
    build: .
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./data:/var/www/html/data
    networks:
      - tracker-net

  tracker-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./tracker-app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tracker-php
    networks:
      - tracker-net

networks:
  tracker-net:
    driver: bridge
